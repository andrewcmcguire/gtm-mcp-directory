# jobs.yaml - the JTBD controlled vocabulary for The GTM MCP Directory
#
# Phase 2, written 2026-08-25. SPEC 2.4 is the authority for the design rules;
# this file is the vocabulary itself. Read alongside data/tags.yaml, which
# carries the per-entry tags, and src/build_directory.py, which merges the two
# into each entry's jobs[] at build time.
#
# ---------------------------------------------------------------------------
# WHAT A TAG MEANS. READ THIS BEFORE TRUSTING ONE.
# ---------------------------------------------------------------------------
# A job tag on an entry means:
#
#     THE VENDOR SAYS THE TOOL DOES THIS.
#
# It does NOT mean:
#
#     Somebody ran the tool and it worked.
#     Somebody called the API and got a result.
#     The capability is available on the gate the entry records.
#     The capability is reachable through the tool's MCP server.
#
# Tags are derived from each entry's what_it_does / ai_features / revops_role
# fields, which are themselves RESEARCHED-tier: facts from public sources with
# URLs, no usage claims, nobody has run the tool. A tag inherits that tier
# exactly and cannot exceed it. SCHEMA law 3 applies without softening: vendor
# copy is a source for what the vendor says, not for capability.
#
# `bench_tested` is still 0 across the whole directory and a job tag does not
# change that number by one.
#
# ---------------------------------------------------------------------------
# DESIGN RULES (SPEC 2.4), restated so they travel with the file
# ---------------------------------------------------------------------------
# 1. A job is a verb plus an object, lowercase, hyphenated, phrased from the
#    agent's side. `enrich-person-from-linkedin-url`, not `person-enrichment`.
# 2. Jobs are cross-category BY DESIGN. `read-crm-records` is carried by tools
#    in 06 and 10 and 12 and 14. This is not a second category system and must
#    never be forced into one.
# 3. A tool carries a job only if its own entry text shows the tool does that
#    thing. When unsure, leave it off and put the entry in tags.yaml's
#    needs_review section. An absent tag is honest; a guessed tag is not.
# 4. A job with almost no supply is a FEATURE, not a gap to paper over. The
#    whole point is publishing "8 tools claim this, 1 is agent-callable".
# 5. Closed vocabulary. A new job lands by editing this file with a one-line
#    rationale, never as an inline string in tags.yaml. The build fails on any
#    job id in tags.yaml that is not defined here.
#
# ---------------------------------------------------------------------------
# FIELDS ON EACH JOB
# ---------------------------------------------------------------------------
#   id                  the slug. stable, closed, referenced by tags.yaml.
#   family              the family id it belongs to. must exist below.
#   phrasing            the agent-side verb+object phrase, plain words.
#   label               the human phrasing for the page.
#   one_liner           what carrying this job asserts, and its edge.
#   primary_categories  where the supply mostly sits. NOT a restriction.
#   aliases             natural-language phrasings an agent might send, used by
#                       find_tools for fuzzy matching and by the page's
#                       capability search. Aliases are matched, never stored.
#
# ---------------------------------------------------------------------------
# DEVIATION FROM SPEC 2.4's STARTER LIST, DECLARED
# ---------------------------------------------------------------------------
# SPEC 2.4 sketched 50 jobs in 10 families before anybody had read the corpus.
# Tagging all 293 entries forced six additions and zero deletions. The six, and
# the supply that forced each:
#
#   discover-warm-intro-paths     named in the wave-2 brief; The Swarm,
#                                 Crossbeam, Affinity, Centralize all sell it
#                                 and nothing in the starter list covered it.
#   research-account-for-call-prep  the single most common unmapped claim in the
#                                 corpus: Sumble, Endgame, Octave, Similarweb,
#                                 Exa, Wiza, Klenty, ZoomInfo Copilot.
#   place-outbound-call           dialers are a real product class (Kixie,
#                                 Nooks, Orum, Trellus, Revenue.io, Close) and
#                                 `run-email-sequence` does not describe them.
#   run-sales-roleplay-practice   eight tools in file 11 sell exactly this and
#                                 `score-rep-performance` is a different job.
#   draft-rfp-response            Arphie, Loopio and Responsive are a category
#                                 of three, which is precisely the thin-supply
#                                 finding rule 4 says to publish.
#   answer-inbound-chat kept from the starter list but widened to cover voice,
#                                 because Trellus and Tavus answer inbound by
#                                 voice and the job is the same job.
#
# 55 jobs, 10 families: 7 / 3 / 9 / 7 / 7 / 6 / 6 / 5 / 3 / 2.
#
# The build counts the supply behind each job and publishes it exactly as
# computed. As of 2026-08-25 the thinnest is reverse-lookup-person-from-email
# with ONE tool in 293 entries. That is the finding, not a bug in the file.

version: 1
vocabulary_status: closed
written_on: 2026-08-25
tier: RESEARCHED
tier_meaning: >-
  A job tag means the vendor says the tool does this. It is not a usage claim,
  not a test result, and not a promise the capability is reachable through the
  tool's MCP server or on the gate the entry records.
spec: directory/product/SPEC.md section 2.4
tags_file: data/tags.yaml

families:
  - id: find-people-and-companies
    label: Find people and companies
    one_liner: Turn a criterion, a domain, a URL or an email into a record.
  - id: get-contact-data
    label: Get contact data
    one_liner: Turn a person into a way to reach them, and check it is real.
  - id: signals-and-research
    label: Signals and research
    one_liner: Find out something changed, or find out what is true right now.
  - id: outreach-and-engagement
    label: Outreach and engagement
    one_liner: Write it, send it, dial it, and read back what happened.
  - id: conversations-and-meetings
    label: Conversations and meetings
    one_liner: Get a meeting on the calendar and get the words out of it.
  - id: systems-of-record
    label: Systems of record and plumbing
    one_liner: Read, write and move the data the rest of the stack argues about.
  - id: deals-and-documents
    label: Deal execution and documents
    one_liner: Quote it, paper it, sign it, and share it with the buyer.
  - id: planning-scoring-coaching
    label: Planning, scoring and coaching
    one_liner: Decide what the number is and who is going to hit it.
  - id: sending-infrastructure
    label: Sending infrastructure
    one_liner: Own the mailboxes, the reputation and the placement.
  - id: mcp-plumbing
    label: MCP plumbing
    one_liner: Find servers, or stand between an agent and somebody's SaaS.

jobs:

  # --- F1. Find people and companies ---------------------------------------

  - id: search-people-by-criteria
    family: find-people-and-companies
    phrasing: search people by criteria
    label: Search people by criteria
    one_liner: Query a person database by title, seniority, function, geo or company filters and get a list back.
    primary_categories: ["01", "05"]
    aliases:
      - find people matching a title and location
      - search for contacts by job title
      - list decision makers at these companies
      - build a prospect list from filters
      - who are the vps of sales at these accounts

  - id: search-companies-by-firmographics
    family: find-people-and-companies
    phrasing: search companies by firmographics
    label: Search companies by firmographics
    one_liner: Query a company database by industry, headcount, revenue, geo or similar and get a list back.
    primary_categories: ["01", "05"]
    aliases:
      - find companies with 50 to 200 employees
      - search for accounts by industry and size
      - list saas companies in germany
      - firmographic company search

  - id: enrich-person-from-linkedin-url
    family: find-people-and-companies
    phrasing: enrich person from linkedin url
    label: Enrich a person from a LinkedIn URL
    one_liner: Hand it a profile URL or a scraped profile and get a structured person record back.
    primary_categories: ["01", "05"]
    aliases:
      - look up a linkedin profile
      - get person data from a profile url
      - i have a linkedin url and i need this person's job title
      - scrape a linkedin profile
      - enrich this profile

  - id: enrich-company-from-domain
    family: find-people-and-companies
    phrasing: enrich company from domain
    label: Enrich a company from a domain
    one_liner: Hand it a domain or company name and get firmographics back.
    primary_categories: ["01", "05"]
    aliases:
      - enrich this company
      - get firmographics for a domain
      - how big is this company
      - fill in company fields from a website

  - id: reverse-lookup-person-from-email
    family: find-people-and-companies
    phrasing: reverse lookup person from email
    label: Reverse-look-up a person from an email
    one_liner: Hand it an email address and get the person or their profile back. Rare as a first-party capability.
    primary_categories: ["01"]
    aliases:
      - who owns this email address
      - find the linkedin profile for this email
      - email to person lookup
      - reverse email lookup

  - id: build-target-account-list
    family: find-people-and-companies
    phrasing: build a target account list
    label: Build a target account list
    one_liner: Produce a ranked or filtered account universe from an ICP definition or a set of best customers.
    primary_categories: ["05", "04"]
    aliases:
      - build me a target account list
      - find lookalikes of my best customers
      - who should i be selling to
      - define my icp universe

  - id: discover-warm-intro-paths
    family: find-people-and-companies
    phrasing: discover warm intro paths
    label: Discover warm intro paths
    one_liner: Answer "who already knows somebody here" from team, partner or relationship-graph data rather than from a bought contact list.
    primary_categories: ["01", "05", "06"]
    aliases:
      - who can introduce me to this account
      - find a warm intro
      - do we know anyone at this company
      - map our relationships into this account
      - partner overlap with this account

  # --- F2. Get contact data ------------------------------------------------

  - id: find-work-email
    family: get-contact-data
    phrasing: find email address
    label: Find a work email address
    one_liner: Hand it a person plus a company, domain or profile URL and get a work email back.
    primary_categories: ["01"]
    aliases:
      - find this person's email
      - find email address
      - get a work email from a name and domain
      - email finder
      - what is their email

  - id: find-phone-number
    family: get-contact-data
    phrasing: find phone number
    label: Find a phone number
    one_liner: Hand it a person and get a direct dial or mobile back. Consistently the scarcer half of contact data.
    primary_categories: ["01"]
    aliases:
      - find this person's phone number
      - get a mobile number
      - direct dial lookup
      - phone finder

  - id: verify-email-deliverable
    family: get-contact-data
    phrasing: verify an email is deliverable
    label: Verify an email is deliverable
    one_liner: Check an address against the mail server or a verification pipeline before anything is sent to it.
    primary_categories: ["01", "09"]
    aliases:
      - is this email valid
      - verify an email address
      - check deliverability before i send
      - clean this email list
      - smtp verification

  # --- F3. Signals and research --------------------------------------------

  - id: identify-anonymous-website-visitor
    family: signals-and-research
    phrasing: detect website visitor intent
    label: Identify an anonymous website visitor
    one_liner: Resolve site traffic to a company, or in a few cases a named person. Person-level resolution is much rarer than the marketing suggests.
    primary_categories: ["05"]
    aliases:

      - find companies hiring for this role
      - job board data as an intent signal

  - id: detect-technographics
    family: signals-and-research
    phrasing: detect technographics
    label: Detect a company's tech stack
    one_liner: Return what software a company runs, from fingerprinting, job posts or a licensed technographic dataset.
    primary_categories: ["05", "01"]
    aliases:
      - what tech stack does this company use
      - find companies running this software
      - technographics for a domain
      - detect installed tools

  - id: detect-funding-or-news-event
    family: signals-and-research
    phrasing: detect funding or news event
    label: Detect a funding or news event
    one_liner: "Return company-level events: funding rounds, M&A, leadership changes, expansion, press."
    primary_categories: ["05", "01"]
    aliases:
      - which of my accounts just raised
      - funding alerts
      - company news triggers
      - tell me when something happens at this account

  - id: scrape-web-page-for-facts
    family: signals-and-research
    phrasing: scrape a web page for facts
    label: Scrape a web page for facts
    one_liner: Fetch and structure an arbitrary public page. The general-purpose fallback when no structured provider has the record.
    primary_categories: ["01", "05"]
    aliases:
      - scrape this page
      - read a website and extract facts
      - crawl the open web for this answer
      - browse and structure a page

  - id: monitor-social-mentions
    family: signals-and-research
    phrasing: monitor social mentions
    label: Monitor social and community mentions
    one_liner: Watch social, forum, community and news surfaces for a keyword, brand or competitor and alert on matches.
    primary_categories: ["15", "05"]
    aliases:
      - alert me when someone mentions us on reddit
      - monitor social mentions
      - track brand mentions
      - who is talking about my competitor
      - keyword alerts across social

  - id: research-account-for-call-prep
    family: signals-and-research
    phrasing: research an account before a call
    label: Research an account before a call
    one_liner: Produce a synthesized read on a company or person from many sources, for prep or qualification rather than as a raw data pull.
    primary_categories: ["05", "01", "04"]
    aliases:
      - research this account before my call
      - give me a brief on this company
      - what should i know before this meeting
      - summarize this prospect
      - account research

  # --- F4. Outreach and engagement -----------------------------------------

  - id: run-email-sequence
    family: outreach-and-engagement
    phrasing: send sequenced outreach
    label: Run an email sequence
    one_liner: Enroll contacts in a multi-step cadence and send it. The execution step, not the writing step.
    primary_categories: ["02", "04"]
    aliases:
      - send sequenced outreach

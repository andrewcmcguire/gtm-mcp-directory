      - run a cold email campaign
      - enroll contacts in a sequence
      - start an email sequence

  - id: send-linkedin-message
    family: outreach-and-engagement
    phrasing: send a linkedin message
    label: Send a LinkedIn message or connection request
    one_liner: "Act on LinkedIn: connect, message, follow up. Carries standing platform-terms risk the directory flags on files 02 and 05."
    primary_categories: ["02", "04"]
    aliases:
      - send a linkedin connection request
      - message someone on linkedin
      - run a linkedin outreach campaign
      - automate linkedin dms

  - id: draft-personalized-outreach
    family: outreach-and-engagement
    phrasing: draft personalized outreach

      - is this account researching us

  - id: track-job-changes
    family: signals-and-research
    phrasing: track job changes
    label: Track job changes
    one_liner: Watch known contacts and tell you when they move, get promoted or land somewhere new.
    primary_categories: ["05", "01"]
    aliases:
      - tell me when my champions change jobs
      - track job changes
      - who from my customer list moved
      - new role alerts for these contacts

  - id: scrape-job-postings
    family: signals-and-research
    phrasing: scrape job postings
    label: Scrape job postings
    one_liner: Query live or historical job listings as a hiring, budget or tech-stack signal.
    primary_categories: ["05", "01"]
    aliases:
      - scrape job postings

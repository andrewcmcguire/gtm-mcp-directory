    primary_categories: ["02", "04", "11"]
    aliases:
      - write me a cold email for this prospect
      - draft personalized outreach
      - generate an opener
      - personalize this message
      - write a follow up

  - id: place-outbound-call
    family: outreach-and-engagement
    phrasing: place an outbound call
    label: Place an outbound call
    one_liner: Dial, including parallel and power dialing, and connect a rep or an agent to a live answer.
    primary_categories: ["02", "04"]
    aliases:
      - dial this list
      - place an outbound call
      - parallel dialer
      - power dial these prospects
      - call this prospect

  - id: create-and-send-prospecting-video
    family: outreach-and-engagement
    phrasing: create and send a prospecting video
    label: Create and send a prospecting video

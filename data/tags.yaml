# ---------------------------------------------------------------------------
# NEEDS REVIEW
# ---------------------------------------------------------------------------
# Every entry here is either untagged or tagged thinly on purpose. Each line
# says which and why. The rule that produced this list: when the entry's own
# text did not clearly show the tool doing a job in the vocabulary, no tag was
# written. An entry named here is not a defect in the entry; it is a defect in
# the confidence of the tagging pass, and Drew or a later editorial pass
# resolves it. Names resolve the same way keys do and the build fails on any
# name here that matches no entry.
#
# reason codes:
#   dead        product is shut down, absorbed or unverifiable in current form.
#               Tagging it would put a tool that cannot be bought into a
#               "which tools do X" answer.
#   no-job-fits the tool does something real that the 56-job vocabulary does
#               not name. Candidate input to a vocabulary change, not a tag.
#   thin        tagged, but with fewer jobs than the entry probably deserves,
#               because the extra claims were too vague to stand behind.
#   unclear     the entry itself says the capability is unconfirmed.

needs_review:
  - name: Bevy
    reason: no-job-fits. Community-event infrastructure (chapters, meetups, gamification). Real product, no job in the vocabulary describes running an events programme. Either a new job or an honest permanent blank.
  - name: Census
    reason: dead. Entry states the standalone product no longer operates and now lives inside Fivetran as Activations. Tags belong on Fivetran, which has sync-records-between-systems.
  - name: Champion
    reason: thin. Tagged score-and-prioritize-leads only. Its champion-to-deal-context matching for references and case studies is close to discover-warm-intro-paths but is matching inside existing accounts, not finding a path into a new one. Drew's call.
  - name: Clockwise
    reason: dead. Entry says THE PRODUCT IS SHUT DOWN. It did book-a-meeting and read-calendar-availability; tagging a dead endpoint as supply is exactly the failure INDEX.md finding 5 warns about.
  - name: Commsor
    reason: dead. Folded into The Swarm's Go-to-Network line. The Swarm carries discover-warm-intro-paths.
  - name: Continu
    reason: no-job-fits. Corporate LMS. retrieve-sales-content is about approved sales collateral, not training courses. A learning-content job may be worth adding once file 11 is looked at as a set.
  - name: Correlated
    reason: dead. Entry records the current form as unknown, with no live product surface to evaluate.
  - name: Drift
    reason: dead. Folded into Salesloft, and the entry states the conversational-AI engine is now a third party (1mind). Tagging answer-inbound-chat would point an agent at a product that no longer exists standalone.
  - name: Exploding Topics
    reason: no-job-fits. Trend and topic velocity detection. It is not mention monitoring and it is not an account signal, so monitor-social-mentions would be wrong. Candidate new job: detect-emerging-topic.
  - name: GummySearch
    reason: dead. Shut down per the entry's notes.
  - name: Klavis AI
    reason: unclear. The entry states the product is agent-training-data infrastructure and explicitly flags the mismatch with Composio/Pipedream. proxy-tool-calls-to-saas is plausible from the "600+ real tools" line and unsupported by everything else on the page.
  - name: Koala
    reason: dead. The entry is written in the past tense throughout. It did identify-anonymous-website-visitor and score-and-prioritize-leads.
  - name: MadKudu
    reason: thin. Tagged score-and-prioritize-leads only. The domain redirects to HG Insights and the entry says the standalone product no longer appears to exist, so the HG Sales Copilot claims (account research, outreach sequences) were not carried over.
  - name: mcp.so
    reason: unclear. The entry could not verify current content. discover-mcp-servers is the obvious tag and there is no fetched evidence for it.
  - name: Model Context Protocol - official servers repo
    reason: no-job-fits. The official reference-servers repo. It is the spec's canonical reference, not a registry an agent queries and not a SaaS proxy.
  - name: Orbit
    reason: dead. Community analytics platform, past tense in the entry.
  - name: Pocus
    reason: dead. Absorbed into a competitor; the entry says features could not be meaningfully evaluated post-acquisition.
  - name: Relevance AI
    reason: thin. Tagged nothing. It is a build-your-own-agent platform and the entry says the agentic depth depends entirely on what the operator configures. Its listed specialist agents (prospecting, scheduling, deal review, proposal building) would each be a tag, but tagging a builder with its example templates would inflate the supply count for six jobs at once.
  - name: SparkToro
    reason: no-job-fits. Audience attention mapping. Not account research, not mention monitoring. Candidate new job: map-audience-attention.
  - name: Superblocks
    reason: no-job-fits. Internal-app building and AI-app governance. run-automation-workflow is not what it does and there is no app-builder job.
  - name: Toplyne
    reason: dead. Entry records the current form as unknown.
  - name: Trainual
    reason: no-job-fits. SOP and process documentation, explicitly described as not sales-specific.
  - name: Ultimate.ai
    reason: dead. Presumed folded into Zendesk AI Agents; no standalone surface to evaluate.
  - name: WorkRamp
    reason: no-job-fits. Corporate LMS, same call as Continu.
  - name: Attio
    reason: thin. Tagged read-crm-records and write-crm-records. The entry mentions automatic data enrichment and meeting-intelligence tooling in the MCP surface but calls the AI surface unconfirmed, so enrich-company-from-domain and summarize-meeting were left off.
  - name: Syncari
    reason: thin. Tagged sync-records-between-systems. Its Master MCP Server exposes governed unified data to agents, which is close to query-data-warehouse, but Syncari is an MDM layer over other systems rather than a warehouse.
  - name: Versium REACH
    reason: thin. Tagged verify-email-deliverable only. Identity-graph append on partial contact records is real but the entry does not say what identifiers go in or what comes out, so no enrich or reverse-lookup tag could be justified.
  - name: Airbyte
    reason: thin. Tagged sync-records-between-systems. The hosted Context Store and the Agents product line let agents query connected data, which reads close to query-data-warehouse, but Airbyte lands data rather than serving analytical queries over it.
  - name: People Data Labs
    reason: close-call, tagged. find-linkedin-url-from-name-and-company was added 2026-09-03 by human-pass on the entry's own what_it_does line, which says it returns profile records (name, job history, education, skills, social handles, contact fields) matched by identifiers like email, name, or LinkedIn URL. A LinkedIn URL is a social handle and name is a stated input; the entry does not say name plus company in so many words. Strike the tag if that reading is too generous.
  - name: Datagma
    reason: close-call, tagged. find-linkedin-url-from-name-and-company was added 2026-09-03 by human-pass on the entry's revops_role, which lists find profile among its Clay waterfall actions (enrich person, enrich company, find email, find mobile, find profile, find employees) in a tool described as pulling prospect data directly from LinkedIn. The entry says profile, not LinkedIn URL; the tag reads that as the LinkedIn profile. Strike it if that reading is too generous.
  - name: Prospeo
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: the Enrich Person API accepts first name + last name + a company identifier and returns linkedin_url, "The person's public LinkedIn URL" (https://prospeo.io/api-docs/enrich-person). The MCP docs describe enrich_person as returning email and/or mobile, so the MCP surface may not expose the URL.
  - name: Lusha
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: Search Contacts looks up contacts by "firstName + lastName + companyName or companyDomain" and returns a preview that includes linkedinUrl (https://docs.lusha.com/apis/openapi/person-api); MCP tool contacts_search.
  - name: RocketReach
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: People Lookup takes name ("Must specify along with current_employer") plus current_employer and returns linkedin_url (https://docs.rocketreach.co/reference/people-lookup-api.md); MCP tool person_lookup.
  - name: Apollo.io
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: People Enrichment accepts first_name and last_name with organization_name or domain and returns linkedin_url, "The URL for the person's LinkedIn profile" (https://docs.apollo.io/reference/people-enrichment); MCP tool apollo_people_match.
  - name: Wiza
    reason: close-call, tagged. Tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: an individual reveal takes "a name, company, and domain" and returns the Profile Details fields, which include Profile URL (https://docs.wiza.co/overview/data-dictionary.md). The vendor field is named Profile URL, not LinkedIn URL; MCP tool enrich_contact says "profile data". Strike the tag if that reading is too generous.
  - name: FullEnrich
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: Look Up People takes "full name combined with a company identifier" and returns social_profiles.professional_network.url with a linkedin.com/in/ example (https://docs.fullenrich.com/api/v2/people/lookup/post.md). The vendor says professional network, not LinkedIn, in the field name.
  - name: Hunter.io
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: the Email Finder takes a domain name, a first name and a last name and its response includes linkedin_url (https://hunter.io/api-documentation/v2). The LinkedIn URL rides along with an email lookup; it is not a standalone finder.
  - name: UpLead
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: the Person API takes first_name, last_name and domain and returns linkedin_url, one credit per record received (https://docs.uplead.com/).
  - name: ZoomInfo
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: MCP tool Enrich Contacts accepts "a name paired with company context" and returns a LinkedIn URL among its fields, one bulk data credit per new contact (https://gtm.ai/content/docs/mcp/tools/enrich-contacts.md).
  - name: Clay
    reason: close-call, tagged. Tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: Clay's catalog action "Find a Person's LinkedIn via Name and Company with SMARTe" is described as "This action enables users to find a person's LinkedIn profile using their name and company" (https://www.clay.com/integrations/action/find-a-persons-linkedin-via-name-and-company-smarte). The data comes from a third-party provider inside Clay, and the Clay MCP names no such tool. Strike the tag if that reading is too generous.
  - name: Coresignal
    reason: close-call, tagged. Tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: the Base Employee search filter takes full_name and experience_company_name and its example records carry a professional-network profile url (https://docs.coresignal.com/employee-api/base-employee-api/endpoints/search-filters.md). The vendor never writes LinkedIn; the tag reads professional network as LinkedIn. Strike it if that reading is too generous.
  - name: Crustdata
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: Person Search accepts basic_profile.name and experience.employment_details.company_name filters and returns social_handles.professional_network_identifier.profile_url with a linkedin.com/in/ value, "0.03 credits per result returned" (https://docs.crustdata.com/person-docs/search/introduction).
  - name: Dropcontact
    reason: tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: the enrich endpoint accepts "first_name + last_name + company (or full_name + company)" and its response includes a linkedin field with a linkedin.com/in/ example (https://developer.dropcontact.com/).
  - name: BetterContact
    reason: close-call, tagged. Tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: the enrichment endpoint takes first_name, last_name and company or company_domain and the results carry contact_linkedin_profile_url (https://doc.bettercontact.rocks/api-reference/endpoint/get). The docs do not say the URL is found when it was not supplied; the field is simply in the documented output. Strike the tag if that reading is too generous.
  - name: PhantomBuster
    reason: close-call, tagged. Tagged 2026-09-03 by human-pass on a sourced sentence appended to the entry's notes the same day: the vendor catalog page is titled "LinkedIn Profile URL Finder" (https://phantombuster.com/automations/linkedin/4015/linkedin-profile-url-finder). The page body did not render for the fetcher; the input and credit statements come from the search index's rendering of the vendor pages, not a fetched sentence. Strike the tag if that is too thin.
  - name: lemlist

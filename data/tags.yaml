# tags.yaml - the per-entry job tags for The GTM MCP Directory
#
# Phase 2, written 2026-08-25. This file is a SOURCE file, hand-edited, and it
# is the only place job tags live. `data/directory.json` is generated output:
# it carries jobs[] because build_directory.py merges this file into it at
# build time, and any tag written directly into directory.json would be gone
# on the next rebuild. Edit here.
#
# ---------------------------------------------------------------------------
# WHAT A TAG MEANS
# ---------------------------------------------------------------------------
# A tag means THE VENDOR SAYS THE TOOL DOES THIS. It is RESEARCHED tier, the
# same tier as the entry it was derived from, and it can never be more than
# that. It is not a test result, not proof the capability is reachable through
# the tool's MCP server, and not proof it is available on the gate the entry
# records. The full statement of the rule is in the header of jobs.yaml.
#
# Tags were derived by reading each entry's what_it_does / ai_features /
# revops_role / category fields and nothing else. No vendor site was fetched,
# no network call was made, and nothing was inferred from a tool's reputation.
#
# ---------------------------------------------------------------------------
# HOW TO EDIT
# ---------------------------------------------------------------------------
#   * Keys are product names. A key is resolved against every entry's
#     normalized name, so ONE key covers all members of a cross-listed product
#     (HubSpot in 06 and 12, Clari in 03 and 04, and the other 14 groups).
#     That is deliberate: the 16 duplicates are one product each, and one
#     product does one set of jobs.
#   * Values are job ids from jobs.yaml. Nothing else is legal.
#   * A job id that is not in jobs.yaml FAILS THE BUILD.
#   * A key that matches no entry FAILS THE BUILD.
#   * Two keys resolving to the same product FAIL THE BUILD.
#   * A job listed twice on one product FAILS THE BUILD.
#   * An entry with no key here gets `jobs: []`. Empty is legal and honest: it
#     means nobody has tagged it, and every surface says so rather than
#     implying the tool does nothing.
#   * A new job needs a jobs.yaml change with a rationale, never an inline
#     string here. Closed vocabulary, SPEC 2.4 rule 5.
#
# Conservatism rule actually applied: a tag was written only where the entry's
# own text states or directly implies the tool performs that job. Where the
# call was close, the tag was left off and the entry is listed in
# needs_review at the bottom with the reason. 255 of the 277 unique products
# carry at least one tag; 22 are untagged and every one of them is named below.
#
# HUMAN PASS 2026-09-03 (owner). One job was added to jobs.yaml,
# find-linkedin-url-from-name-and-company, and applied only to entries whose
# own text supports it. Each such tag carries two whole-line comments directly
# above it recording tagged_by: human-pass and tagged_on: 2026-09-03, because
# the file-level tagged_by / tagged_on below describe the 2026-08-25 machine
# pass and the build accepts one file-level value. Candidates read for that
# job and NOT tagged, because their entry text does not say it: Prospeo,
# Lusha, RocketReach, Apollo.io, CUFinder, LeadMagic, Hunter.io, Exa,
# Bright Data, Coresignal, Crustdata, Wiza, FullEnrich, Clay, ZoomInfo,
# Cognism, Seamless.AI, UpLead, Snov.io, Dropcontact, Anymail Finder,
# Findymail, BetterContact, PhantomBuster, Surfe, Ocean.io, Explorium,
# TheirStack, lemlist, La Growth Machine, HeyReach. Not in the directory:
# Vayne, Kaspr, Enrichley, Icypeas, Proxycurl, Nubela, Evaboot,
# Reverse Contact, Swordfish, ContactOut, SignalHire, GetProspect, LeadIQ,
# Skrapp, AeroLeads, Nimbler, Forager, Unipile, Captain Data.
# Later on 2026-09-03 a builder pass fetched vendor docs for the candidates
# named above,
# appended a dated, sourced sentence to the notes of the entries whose docs
# state the capability, and tagged those 19 under the same whole-line
# comments: Prospeo, Lusha, RocketReach, Apollo.io, Wiza, FullEnrich,
# Hunter.io, UpLead, ZoomInfo, Clay, Coresignal, Crustdata, Dropcontact,
# BetterContact, PhantomBuster, lemlist, Surfe, CUFinder, Explorium. Each
# has a needs_review item quoting the sentence relied on. Still not tagged
# after that pass, because no vendor page fetched states it: Snov.io,
# Seamless.AI, Cognism, Exa, Bright Data, LeadMagic, Anymail Finder,
# Findymail, HeyReach, La Growth Machine, Ocean.io.

version: 1
tagged_on: 2026-08-25
tagged_by: machine-pass
tier: RESEARCHED
tier_meaning: >-
  A job tag means the vendor says the tool does this. No tag on any entry has
  been verified by running the tool. As of 2026-09-03 exactly one entry in this
  directory has been bench-tested at all (01-exa, see directory/BENCH_2026-09-03.md);
  every other entry is untested and every tag on every entry, including that one,
  remains a vendor claim. The live number is counts.bench_tested in directory.json.
job_vocabulary: data/jobs.yaml
key_resolution: >-
  Keys are matched against each entry's normalized name (lowercased,
  parentheticals dropped, punctuation collapsed), the same normalisation
  tools_recount.py uses to detect cross-file duplicates. One key therefore
  covers every entry for the same product.


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtm-mcp-directory"
version = "0.1.0"
description = "The GTM MCP Directory as an MCP server. Local, offline, zero outbound requests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Andrew McGuire" }]
keywords = ["mcp", "gtm", "revops", "directory", "agent-operator"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = [
  "fastmcp>=2.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://andrewcmcguire.com/gtm-directory"
Repository = "https://github.com/andrewcmcguire/gtm-mcp-directory"

[project.scripts]
gtm-mcp-directory = "gtm_mcp_directory.server:main"

[tool.hatch.build.targets.wheel]
packages = ["gtm_mcp_directory"]

# The package carries a copy of the directory under gtm_mcp_directory/data/,
# put there by `python sync_data.py` before every build. It lives INSIDE the
# package so that an sdist unpacked anywhere still builds a working wheel; the
# old force-include reached outside the project root and broke sdist builds.
# When run from a repo checkout the server prefers ../../data/directory.json
# (the live build) over the bundled copy, per loading.candidate_paths().
[tool.hatch.build.targets.sdist]
include = ["gtm_mcp_directory/**", "README.md", "LICENSE", "pyproject.toml", "sync_data.py", "qa_stdio.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtm-mcp-directory"
version = "0.1.0"
description = "The GTM MCP Directory as an MCP server. Local, offline, zero outbound requests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew McGuire" }]
keywords = ["mcp", "gtm", "revops", "directory", "agent-operator"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = [
  "fastmcp>=2.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://andrewcmcguire.com/mcp-directory"
Repository = "https://github.com/andrewcmcguire/gtm-mcp-directory"

[project.scripts]
gtm-mcp-directory = "gtm_mcp_directory.server:main"

[tool.hatch.build.targets.wheel]
packages = ["gtm_mcp_directory"]

# The wheel bakes a copy of the directory at release time. The server also
# resolves the repo layout (product/data/directory.json) when run from a
# checkout, so a local clone always reads the live build.
[tool.hatch.build.targets.wheel.force-include]
"../data/directory.json" = "gtm_mcp_directory/data/directory.json"
"../data/build_report.json" = "gtm_mcp_directory/data/build_report.json"
